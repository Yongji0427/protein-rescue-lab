<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img"><rect width="1200" height="520" rx="24" fill="#f3f6fc"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="48" font-size="12" fill="#345fc4" font-weight="700">SYSTEM ARCHITECTURE / 系统架构</text><text x="48" y="90" font-size="30" fill="#1b2c4a" font-weight="700">系统如何协作</text><text x="48" y="118" font-size="15" fill="#50617e" font-weight="400">智能体通过科学工具箱发起请求，评测器按预算返回反馈。</text><rect x="48" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="68" y="169" font-size="12" fill="#345fc4" font-weight="700">01 / 智能体</text><text x="68" y="201" font-size="21" fill="#213453" font-weight="700">Agnes 智能体</text><text x="68" y="226" font-size="14" fill="#536580" font-weight="400">推理、查看信息</text><text x="68" y="248" font-size="14" fill="#536580" font-weight="400">并选择行动</text><path d="M392 205h25" stroke="#6788c8" stroke-width="2"/><path d="M412 200l5 5-5 5" fill="none" stroke="#6788c8" stroke-width="2"/><rect x="424" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="444" y="169" font-size="12" fill="#345fc4" font-weight="700">02 / 工具箱</text><text x="444" y="201" font-size="21" fill="#213453" font-weight="700">科学工具箱</text><text x="444" y="226" font-size="14" fill="#536580" font-weight="400">类型化工具</text><text x="444" y="248" font-size="14" fill="#536580" font-weight="400">与会话钩子</text><path d="M768 205h25" stroke="#6788c8" stroke-width="2"/><path d="M788 200l5 5-5 5" fill="none" stroke="#6788c8" stroke-width="2"/><rect x="800" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="820" y="169" font-size="12" fill="#345fc4" font-weight="700">03 / 评测器</text><text x="820" y="201" font-size="21" fill="#213453" font-weight="700">独立评测器</text><text x="820" y="226" font-size="14" fill="#536580" font-weight="400">验证查询、执行预算</text><text x="820" y="248" font-size="14" fill="#536580" font-weight="400">并记录任务状态</text><text x="48" y="301" font-size="14" fill="#345fc4" font-weight="600">← 已观察结果与剩余预算经工具箱返回</text><text x="48" y="337" font-size="12" fill="#60738f" font-weight="700">数据访问与执行边界</text><rect x="48" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="66" y="379" font-size="16" fill="#213453" font-weight="700">智能体可见</text><text x="66" y="406" font-size="13" fill="#536580" font-weight="400">公开特征与</text><text x="66" y="427" font-size="13" fill="#536580" font-weight="400">已观察测量</text><rect x="424" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="442" y="379" font-size="16" fill="#213453" font-weight="700">评测器持有</text><text x="442" y="406" font-size="13" fill="#536580" font-weight="400">未查询的历史标签</text><text x="442" y="427" font-size="13" fill="#536580" font-weight="400">和持久任务状态</text><rect x="800" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="818" y="379" font-size="16" fill="#213453" font-weight="700">受限执行</text><text x="818" y="406" font-size="13" fill="#536580" font-weight="400">Python 分析通过</text><text x="818" y="427" font-size="13" fill="#536580" font-weight="400">macOS 沙箱执行</text><text x="48" y="490" font-size="13" fill="#596d88" font-weight="400">原型边界：评测器可访问输入标签；不宣称完整的操作系统级隔离。</text></g></svg>