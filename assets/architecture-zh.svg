<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="Protein Rescue Lab architecture"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfb"/><stop offset="1" stop-color="#edf4f5"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7697a1"/></marker></defs><rect width="1200" height="690" rx="26" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="55" y="62" font-size="13" fill="#16877b" font-weight="700" letter-spacing="2">系统架构</text><text x="55" y="111" font-size="36" fill="#102b3d" font-weight="700" >从科学问题到证据</text><text x="55" y="145" font-size="16" fill="#647889" font-weight="400" >科学工具箱连接智能体与受预算约束的历史数据评测器。</text><rect x="55" y="186" width="330" height="174" rx="18" fill="#fff" stroke="#d9e6e8"/><rect x="77" y="208" width="37" height="37" rx="11" fill="#dff4eb"/><text x="85" y="232" font-size="13" fill="#268e79" font-weight="700" >01</text><text x="128" y="232" font-size="12" fill="#268e79" font-weight="700" letter-spacing="1">智能体层</text><text x="78" y="282" font-size="23" fill="#123044" font-weight="700" >Agnes 智能体</text><text x="78" y="310" font-size="14" fill="#61778a" font-weight="400" >推理、选择工具</text><text x="78" y="332" font-size="14" fill="#61778a" font-weight="400" >并提出行动</text><rect x="435" y="186" width="330" height="174" rx="18" fill="#fff" stroke="#d9e6e8"/><rect x="457" y="208" width="37" height="37" rx="11" fill="#e4edff"/><text x="465" y="232" font-size="13" fill="#5079bd" font-weight="700" >02</text><text x="508" y="232" font-size="12" fill="#5079bd" font-weight="700" letter-spacing="1">工具层</text><text x="458" y="282" font-size="23" fill="#123044" font-weight="700" >科学工具箱</text><text x="458" y="310" font-size="14" fill="#61778a" font-weight="400" >类型化工具、会话钩子</text><text x="458" y="332" font-size="14" fill="#61778a" font-weight="400" >与结构化请求</text><rect x="815" y="186" width="330" height="174" rx="18" fill="#fff" stroke="#d9e6e8"/><rect x="837" y="208" width="37" height="37" rx="11" fill="#e6f2ef"/><text x="845" y="232" font-size="13" fill="#238a81" font-weight="700" >03</text><text x="888" y="232" font-size="12" fill="#238a81" font-weight="700" letter-spacing="1">评测层</text><text x="838" y="282" font-size="23" fill="#123044" font-weight="700" >评测器</text><text x="838" y="310" font-size="14" fill="#61778a" font-weight="400" >验证请求、执行预算</text><text x="838" y="332" font-size="14" fill="#61778a" font-weight="400" >并记录状态</text><path d="M389 273h38" stroke="#7697a1" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="257" font-size="11" fill="#67818c" font-weight="600" text-anchor="middle">工具调用</text><path d="M769 273h38" stroke="#7697a1" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="257" font-size="11" fill="#67818c" font-weight="600" text-anchor="middle">HTTP + JSON</text><path d="M980 361v30H220v-30" fill="none" stroke="#6db5a5" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="600" y="415" font-size="13" fill="#3b8178" font-weight="600" text-anchor="middle">已观察的反馈经由工具箱返回智能体</text><text x="56" y="463" font-size="12" fill="#778d98" font-weight="700" letter-spacing="1.3">评测器输入与支持</text><rect x="55" y="481" width="270" height="92" rx="14" fill="#fff" stroke="#dbe8e9"/><circle cx="76" cy="507" r="4" fill="#55b3a1"/><text x="89" y="512" font-size="16" fill="#193849" font-weight="700" >公开候选</text><text x="75" y="544" font-size="12" fill="#6a7e8c" font-weight="400" >序列与参考特征</text><rect x="338" y="481" width="270" height="92" rx="14" fill="#fff" stroke="#dbe8e9"/><circle cx="359" cy="507" r="4" fill="#55b3a1"/><text x="372" y="512" font-size="16" fill="#193849" font-weight="700" >历史测量</text><text x="358" y="544" font-size="12" fill="#6a7e8c" font-weight="400" >未查询标签由评测器持有</text><rect x="621" y="481" width="270" height="92" rx="14" fill="#fff" stroke="#dbe8e9"/><circle cx="642" cy="507" r="4" fill="#55b3a1"/><text x="655" y="512" font-size="16" fill="#193849" font-weight="700" >持久任务状态</text><text x="641" y="544" font-size="12" fill="#6a7e8c" font-weight="400" >预算、决策与结论</text><rect x="904" y="481" width="270" height="92" rx="14" fill="#fff" stroke="#dbe8e9"/><circle cx="925" cy="507" r="4" fill="#55b3a1"/><text x="938" y="512" font-size="16" fill="#193849" font-weight="700" >受限分析</text><text x="924" y="544" font-size="12" fill="#6a7e8c" font-weight="400" >macOS Seatbelt 子进程</text><path d="M55 620H1145" stroke="#d4e3e5"/><text x="56" y="649" font-size="13" fill="#6b8491" font-weight="400" >研究原型  ·  历史数据回放，不是湿实验</text></g></svg>