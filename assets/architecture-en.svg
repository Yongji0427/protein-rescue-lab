<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img"><rect width="1200" height="520" rx="24" fill="#f3f6fc"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="48" font-size="12" fill="#345fc4" font-weight="700">SYSTEM ARCHITECTURE / 系统架构</text><text x="48" y="90" font-size="30" fill="#1b2c4a" font-weight="700">How the system works</text><text x="48" y="118" font-size="15" fill="#50617e" font-weight="400">A budgeted request and feedback loop through the scientific toolbox.</text><rect x="48" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="68" y="169" font-size="12" fill="#345fc4" font-weight="700">01 / AGENT</text><text x="68" y="201" font-size="21" fill="#213453" font-weight="700">Agnes agent</text><text x="68" y="226" font-size="14" fill="#536580" font-weight="400">Reason, inspect</text><text x="68" y="248" font-size="14" fill="#536580" font-weight="400">and choose actions</text><path d="M392 205h25" stroke="#6788c8" stroke-width="2"/><path d="M412 200l5 5-5 5" fill="none" stroke="#6788c8" stroke-width="2"/><rect x="424" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="444" y="169" font-size="12" fill="#345fc4" font-weight="700">02 / TOOLBOX</text><text x="444" y="201" font-size="21" fill="#213453" font-weight="700">Science toolbox</text><text x="444" y="226" font-size="14" fill="#536580" font-weight="400">Typed tools and</text><text x="444" y="248" font-size="14" fill="#536580" font-weight="400">session hooks</text><path d="M768 205h25" stroke="#6788c8" stroke-width="2"/><path d="M788 200l5 5-5 5" fill="none" stroke="#6788c8" stroke-width="2"/><rect x="800" y="144" width="340" height="126" rx="16" fill="white" stroke="#d8e2f0"/><text x="820" y="169" font-size="12" fill="#345fc4" font-weight="700">03 / EVALUATOR</text><text x="820" y="201" font-size="21" fill="#213453" font-weight="700">Evaluator</text><text x="820" y="226" font-size="14" fill="#536580" font-weight="400">Validate queries, enforce</text><text x="820" y="248" font-size="14" fill="#536580" font-weight="400">budget and record state</text><text x="48" y="301" font-size="14" fill="#345fc4" font-weight="600">← Observed results and remaining budget return via the toolbox</text><text x="48" y="337" font-size="12" fill="#60738f" font-weight="700">DATA &amp; EXECUTION BOUNDARIES</text><rect x="48" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="66" y="379" font-size="16" fill="#213453" font-weight="700">Visible to the agent</text><text x="66" y="406" font-size="13" fill="#536580" font-weight="400">Public features and</text><text x="66" y="427" font-size="13" fill="#536580" font-weight="400">observed measurements</text><rect x="424" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="442" y="379" font-size="16" fill="#213453" font-weight="700">Held by evaluator</text><text x="442" y="406" font-size="13" fill="#536580" font-weight="400">Unqueried historical labels</text><text x="442" y="427" font-size="13" fill="#536580" font-weight="400">and persistent task state</text><rect x="800" y="351" width="340" height="103" rx="14" fill="#fff" stroke="#d8e2f0"/><text x="818" y="379" font-size="16" fill="#213453" font-weight="700">Restricted execution</text><text x="818" y="406" font-size="13" fill="#536580" font-weight="400">Python analysis uses a</text><text x="818" y="427" font-size="13" fill="#536580" font-weight="400">macOS sandbox</text><text x="48" y="490" font-size="13" fill="#596d88" font-weight="400">Prototype boundary: evaluator can access its inputs. Full OS isolation is not asserted.</text></g></svg>